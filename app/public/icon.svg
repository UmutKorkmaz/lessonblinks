<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LessonBlinks">
  <defs>
    <!-- Disc: Solana purple → periwinkle → green, diagonal -->
    <linearGradient id="disc" x1="14%" y1="10%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="38%" stop-color="#8A75F0"/>
      <stop offset="68%" stop-color="#4FBBC2"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <!-- Soft specular sheen on the upper-left of the disc -->
    <radialGradient id="sheen" cx="30%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Depth shading on the lower-right of the disc -->
    <radialGradient id="shade" cx="74%" cy="82%" r="70%">
      <stop offset="0%" stop-color="#07070D" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#07070D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07070D" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient glows in the card corners -->
    <radialGradient id="glowPurple" cx="16%" cy="6%" r="65%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="88%" cy="96%" r="65%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <!-- Halo immediately around the disc -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#9945FF" stop-opacity="0"/>
      <stop offset="84%" stop-color="#9945FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="discClip">
      <circle cx="256" cy="256" r="164"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect width="512" height="512" rx="116" fill="#07070D"/>
  <rect width="512" height="512" rx="116" fill="url(#glowPurple)"/>
  <rect width="512" height="512" rx="116" fill="url(#glowGreen)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Halo behind the disc -->
  <circle cx="256" cy="256" r="216" fill="url(#halo)"/>

  <!-- Gradient disc with sheen and shading -->
  <circle cx="256" cy="256" r="164" fill="url(#disc)"/>
  <g clip-path="url(#discClip)">
    <circle cx="256" cy="256" r="164" fill="url(#shade)"/>
    <circle cx="256" cy="256" r="164" fill="url(#sheen)"/>
  </g>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- Solana ◎ mark drawn as geometry (no font dependency) -->
  <circle cx="256" cy="256" r="98" fill="none" stroke="#0A0A13" stroke-width="17"/>
  <circle cx="256" cy="256" r="56" fill="none" stroke="#0A0A13" stroke-width="17"/>
</svg>
